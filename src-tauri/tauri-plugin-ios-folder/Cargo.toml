[package]
name = "tauri-plugin-ios-folder"
version = "0.1.0"
authors = [ "You" ]
description = ""
edition = "2021"
rust-version = "1.98.1"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-ios-folder"

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
serde_json = "1.0"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22.1"
objc2 = { version = "0.6", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSSavePanel",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSError",
    "NSString",
    "NSURL",
] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
