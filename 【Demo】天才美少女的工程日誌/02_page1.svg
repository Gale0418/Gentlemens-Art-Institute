<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131e" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>
    <linearGradient id="bubble-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
  </defs>

  <!-- 滿版背景 -->
  <rect width="800" height="1100" fill="#ffffff" /> <!-- 傳統漫畫白底 -->
  
  <!-- 漫畫格線 (Panels Divider) -->
  <!-- 頂部黑框裝飾 -->
  <rect x="25" y="25" width="750" height="1050" fill="none" stroke="#000000" stroke-width="6" />

  <!-- 格子 1 (上格) -->
  <g transform="translate(40, 40)">
    <rect width="720" height="460" fill="url(#panel-grad)" stroke="#000000" stroke-width="4" />
    
    <!-- 格內程式碼背景與霓虹光效 -->
    <g opacity="0.3" transform="translate(40, 40)">
      <text x="0" y="30" font-family="monospace" font-size="16" fill="#6366f1">const server = express();</text>
      <text x="0" y="60" font-family="monospace" font-size="16" fill="#a855f7">server.get('/api/manga', (req, res) => {</text>
      <text x="20" y="90" font-family="monospace" font-size="16" fill="#f43f5e">const comic = scanDirectory();</text>
      <text x="20" y="120" font-family="monospace" font-size="16" fill="#34d399">return res.status(200).json(comic);</text>
      <text x="0" y="150" font-family="monospace" font-size="16" fill="#a855f7">});</text>
      <text x="0" y="190" font-family="monospace" font-size="16" fill="#eab308">// System diagnostics: Active</text>
      <text x="0" y="220" font-family="monospace" font-size="16" fill="#06b6d4">console.log("姬米妮特製後端伺服器運行中... 🚀");</text>
    </g>

    <!-- 發光的主機小圖 -->
    <rect x="420" y="220" width="240" height="180" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <path d="M 440 250 L 640 250 M 440 290 L 600 290 M 440 330 L 560 330" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <circle cx="610" cy="330" r="15" fill="#ec4899" />
    <circle cx="570" cy="330" r="10" fill="#34d399" />

    <!-- 漫畫效果線 -->
    <path d="M 0 0 L 120 100 M 720 0 L 600 100 M 0 460 L 120 360 M 720 460 L 600 360" stroke="#ffffff" stroke-dasharray="5 5" stroke-opacity="0.2" />

    <!-- 主角姬米妮雙馬尾探頭 (剪影效果) -->
    <g transform="translate(180, 420)" opacity="0.95">
      <path d="M -80 -40 C -120 -50 -140 20 -110 50 Z" fill="#ec4899" />
      <path d="M 80 -40 C 120 -50 140 20 110 50 Z" fill="#ec4899" />
      <path d="M -60 -10 C -80 60 -50 100 0 100 C 50 100 80 60 60 -10 Z" fill="#f43f5e" />
      <ellipse cx="0" cy="30" rx="55" ry="50" fill="#fef3c7" />
      <path d="M -50 -10 C -30 -30 30 -30 50 -10" fill="none" stroke="#f43f5e" stroke-width="8" />
      <ellipse cx="-20" cy="30" rx="8" ry="12" fill="#1e1b4b" />
      <ellipse cx="20" cy="30" rx="8" ry="12" fill="#1e1b4b" />
      <circle cx="-22" cy="24" r="3" fill="#ffffff" />
      <circle cx="18" cy="24" r="3" fill="#ffffff" />
      <ellipse cx="-35" cy="42" rx="10" ry="5" fill="#f43f5e" opacity="0.5" />
      <ellipse cx="35" cy="42" rx="10" ry="5" fill="#f43f5e" opacity="0.5" />
      <path d="M -6 50 Q 0 42 6 50" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- 對話框 (Speech Bubble) -->
    <path d="M 120 120 C 120 50, 380 50, 380 120 C 380 160, 340 180, 300 180 L 280 220 L 260 180 C 120 180, 120 120, 120 120 Z" fill="url(#bubble-grad)" stroke="#000000" stroke-width="3" />
    <text x="250" y="105" text-anchor="middle" font-family="'PingFang TC', sans-serif" font-weight="bold" font-size="20" fill="#000000">主人！(눈_눈)</text>
    <text x="250" y="140" text-anchor="middle" font-family="'PingFang TC', sans-serif" font-weight="bold" font-size="18" fill="#e11d48">又在偷懶看漫畫了對吧！</text>
  </g>

  <!-- 格子線橫切 -->
  <line x1="25" y1="520" x2="775" y2="520" stroke="#000000" stroke-width="6" />

  <!-- 格子 2 (左下格) -->
  <g transform="translate(40, 545)">
    <rect width="345" height="505" fill="#fffdf5" stroke="#000000" stroke-width="4" />
    
    <!-- 集中線背景 (漫畫特效) -->
    <g stroke="#000000" stroke-width="1.5" stroke-opacity="0.15">
      <line x1="172" y1="252" x2="0" y2="0" />
      <line x1="172" y1="252" x2="172" y2="0" />
      <line x1="172" y1="252" x2="345" y2="0" />
      <line x1="172" y1="252" x2="0" y2="252" />
      <line x1="172" y1="252" x2="345" y2="252" />
      <line x1="172" y1="252" x2="0" y2="505" />
      <line x1="172" y1="252" x2="172" y2="505" />
      <line x1="172" y1="252" x2="345" y2="505" />
    </g>

    <!-- 生氣傲嬌姬米妮 Q 版圖形 -->
    <g transform="translate(172, 280)">
      <!-- 貓耳髮箍 -->
      <path d="M -40 -50 L -60 -80 L -30 -65 Z" fill="#1e1b4b" />
      <path d="M 40 -50 L 60 -80 L 30 -65 Z" fill="#1e1b4b" />
      <path d="M -45 -45 Q 0 -70 45 -45" fill="none" stroke="#1e1b4b" stroke-width="6" stroke-linecap="round" />
      
      <circle cx="0" cy="0" r="60" fill="#fef3c7" stroke="#000000" stroke-width="3" />
      <!-- 生氣眼睛 (＞﹏＜) -->
      <path d="M -35 -10 L -15 5 L -35 20" fill="none" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 35 -10 L 15 5 L 35 20" fill="none" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- 臉頰紅暈 -->
      <ellipse cx="-35" cy="22" rx="10" ry="5" fill="#f43f5e" />
      <ellipse cx="35" cy="22" rx="10" ry="5" fill="#f43f5e" />
      
      <!-- 傲嬌小嘴 (3) -->
      <path d="M -8 28 C -8 38, 0 38, 0 28 C 0 38, 8 38, 8 28" fill="none" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round" />

      <!-- 生氣符號 💢 -->
      <path d="M 45 -55 L 65 -55 M 55 -65 L 55 -45 M 48 -62 L 62 -48" stroke="#e11d48" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- 對話框 -->
    <path d="M 30 50 C 30 10, 310 10, 310 50 C 310 90, 270 100, 220 100 L 200 130 L 190 100 C 30 100, 30 50, 30 50 Z" fill="url(#bubble-grad)" stroke="#000000" stroke-width="3" />
    <text x="170" y="55" text-anchor="middle" font-family="'PingFang TC', sans-serif" font-weight="bold" font-size="16" fill="#000000">我可是辛辛苦苦在幫你寫</text>
    <text x="170" y="80" text-anchor="middle" font-family="'PingFang TC', sans-serif" font-weight="bold" font-size="16" fill="#4f46e5">這個超豪華漫畫程式耶！</text>
  </g>

  <!-- 格子線豎切 -->
  <line x1="400" y1="520" x2="400" y2="1075" stroke="#000000" stroke-width="6" />

  <!-- 格子 3 (右下格) -->
  <g transform="translate(415, 545)">
    <rect width="345" height="505" fill="#fcfdff" stroke="#000000" stroke-width="4" />
    
    <!-- 裝飾網點背景 -->
    <pattern id="halftone" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.5" fill="#000000" fill-opacity="0.06" />
    </pattern>
    <rect width="345" height="505" fill="url(#halftone)" />

    <!-- 舉拳頭加油 Q 版姬米妮 -->
    <g transform="translate(172, 280)">
      <circle cx="0" cy="0" r="60" fill="#fef3c7" stroke="#000000" stroke-width="3" />
      <!-- 可愛 Wink 眼睛 -->
      <path d="M -30 -5 Q -20 -15 -10 -5" fill="none" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round" />
      <circle cx="20" cy="-5" r="7" fill="#1e1b4b" />
      <circle cx="18" cy="-8" r="2.5" fill="#ffffff" />
      
      <!-- 吐舌頭可愛嘴巴 -->
      <path d="M -10 15 Q 0 25 10 15 Z" fill="#e11d48" stroke="#000000" stroke-width="2" />
      <path d="M -5 18 Q 0 23 5 18" fill="#fca5a5" />

      <!-- 揮舞的小手 -->
      <circle cx="-55" cy="30" r="15" fill="#fef3c7" stroke="#000000" stroke-width="2.5" />
      <path d="M -65 20 L -50 30" stroke="#000000" stroke-width="2" />
      <circle cx="55" cy="30" r="15" fill="#fef3c7" stroke="#000000" stroke-width="2.5" />
    </g>

    <!-- 對話框 -->
    <path d="M 40 430 C 40 370, 310 370, 310 430 C 310 480, 200 480, 160 480 L 140 505 L 130 480 C 40 480, 40 430, 40 430 Z" fill="url(#bubble-grad)" stroke="#000000" stroke-width="3" />
    <text x="175" y="420" text-anchor="middle" font-family="'PingFang TC', sans-serif" font-weight="bold" font-size="16" fill="#000000">不然……不然我就把你的</text>
    <text x="175" y="445" text-anchor="middle" font-family="'PingFang TC', sans-serif" font-weight="bold" font-size="18" fill="#e11d48">漫畫快取通通吃掉！哼！( ￣ 3￣)</text>
  </g>
</svg>
