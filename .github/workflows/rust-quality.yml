name: Rust quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --package gai -- --check
      - name: test
        run: cargo test --lib
      - name: clippy
        run: cargo clippy --lib --bins --no-deps -- -D warnings
