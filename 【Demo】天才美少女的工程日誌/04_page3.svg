<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="100%" stop-color="#fff1f2" />
    </linearGradient>
    <linearGradient id="bubble-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
  </defs>

  <!-- 滿版背景 -->
  <rect width="800" height="1100" fill="#ffffff" />

  <!-- 漫畫格外框 -->
  <rect x="25" y="25" width="750" height="1050" fill="none" stroke="#000000" stroke-width="6" />

  <!-- 格子 1 (整版大格，大團圓感) -->
  <rect x="40" y="40" width="720" height="1020" fill="url(#sky-grad)" stroke="#000000" stroke-width="4" />
  
  <!-- 科技與櫻花飄散背景 -->
  <g fill="#ec4899" fill-opacity="0.15">
    <path d="M 100 150 Q 110 130 120 150 T 100 170 T 80 150 Z" transform="rotate(15 100 150)" />
    <path d="M 680 200 Q 690 180 700 200 T 680 220 T 660 200 Z" transform="rotate(-30 680 200)" />
    <path d="M 150 780 Q 160 760 170 780 T 150 800 T 130 780 Z" transform="rotate(45 150 780)" />
    <path d="M 620 850 Q 630 830 640 850 T 620 870 T 600 850 Z" transform="rotate(10 620 850)" />
    <path d="M 380 90 Q 390 70 400 90 T 380 110 T 360 90 Z" transform="rotate(-15 380 90)" />
  </g>

  <!-- 科技幾何裝飾環 -->
  <circle cx="400" cy="500" r="300" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="10 10" />
  <circle cx="400" cy="500" r="280" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.15" />

  <!-- 姬米妮雙手比心超級大圖 -->
  <g transform="translate(400, 520)">
    <!-- 後面大緞帶 -->
    <path d="M -160 -100 C -220 -150 -200 50 -140 120 Z" fill="#ec4899" />
    <path d="M 160 -100 C 220 -150 200 50 140 120 Z" fill="#ec4899" />
    
    <!-- 秀髮背景 -->
    <path d="M -120 -80 C -160 50 -100 250 0 250 C 100 250 160 50 120 -80 Z" fill="#f43f5e" />

    <!-- 臉部與耳朵 -->
    <ellipse cx="0" cy="-10" rx="105" ry="95" fill="#fef3c7" stroke="#000000" stroke-width="3" />
    <circle cx="-110" cy="-10" r="18" fill="#fef3c7" stroke="#000000" stroke-width="3" />
    <circle cx="110" cy="-10" r="18" fill="#fef3c7" stroke="#000000" stroke-width="3" />
    <!-- 耳朵遮蓋 -->
    <ellipse cx="0" cy="-10" rx="103" ry="93" fill="#fef3c7" />

    <!-- 前瀏海 -->
    <path d="M -105 -35 C -80 -95 -30 -105 0 -85 C 30 -105 80 -95 105 -35 C 95 -60 65 -70 40 -60 C 15 -70 -15 -70 -40 -60 C -65 -70 -95 -60 -105 -35 Z" fill="#f43f5e" stroke="#000000" stroke-width="3" />
    <!-- 瀏海修正色 -->
    <path d="M -102 -35 C -80 -92 -30 -102 0 -82 C 30 -102 80 -92 102 -35 C 92 -58 65 -68 40 -58 C 15 -68 -15 -68 -40 -58 C -65 -68 -92 -58 -102 -35 Z" fill="#f43f5e" />

    <!-- 兩側鬢角頭髮 -->
    <path d="M -105 -10 Q -90 120 -60 160" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 105 -10 Q 90 120 60 160" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />

    <!-- 亮亮萌系大眼睛 -->
    <!-- 左眼 -->
    <ellipse cx="-45" cy="-5" rx="18" ry="26" fill="#1e1b4b" />
    <ellipse cx="-43" cy="-10" rx="14" ry="20" fill="#6366f1" />
    <circle cx="-50" cy="-18" r="8" fill="#ffffff" />
    <circle cx="-38" cy="4" r="4.5" fill="#ffffff" />
    <path d="M -60 -25 Q -45 -35 -30 -25" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <!-- 右眼 -->
    <ellipse cx="45" cy="-5" rx="18" ry="26" fill="#1e1b4b" />
    <ellipse cx="43" cy="-10" rx="14" ry="20" fill="#6366f1" />
    <circle cx="38" cy="-18" r="8" fill="#ffffff" />
    <circle cx="50" cy="4" r="4.5" fill="#ffffff" />
    <path d="M 30 -25 Q 45 -35 60 -25" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />

    <!-- 粉嫩腮紅 -->
    <ellipse cx="-75" cy="20" rx="16" ry="8" fill="#f43f5e" opacity="0.5" />
    <ellipse cx="75" cy="20" rx="16" ry="8" fill="#f43f5e" opacity="0.5" />
    <!-- 腮紅斜線 -->
    <line x1="-80" y1="23" x2="-70" y2="17" stroke="#ffffff" stroke-width="1.5" />
    <line x1="-75" y1="23" x2="-65" y2="17" stroke="#ffffff" stroke-width="1.5" />
    <line x1="70" y1="23" x2="80" y2="17" stroke="#ffffff" stroke-width="1.5" />
    <line x1="75" y1="23" x2="85" y2="17" stroke="#ffffff" stroke-width="1.5" />

    <!-- 萌系大微笑 -->
    <path d="M -12 25 Q 0 45 12 25 Z" fill="#e11d48" stroke="#000000" stroke-width="3" />
    <path d="M -8 28 Q 0 38 8 28" fill="#ff85a2" />

    <!-- 身體與水手服衣領 -->
    <path d="M -60 85 L -90 220 L 90 220 L 60 85 Z" fill="#ffffff" stroke="#000000" stroke-width="3" />
    <path d="M -80 120 L 0 185 L 80 120 L 60 85 L -60 85 Z" fill="#312e81" stroke="#000000" stroke-width="3" />
    <!-- 大紅領結 -->
    <path d="M -30 180 L 0 160 L 30 180 L 20 220 L 0 200 L -20 220 Z" fill="#e11d48" stroke="#000000" stroke-width="2.5" />

    <!-- 雙手在胸前比愛心 (❤️) -->
    <!-- 左手 -->
    <circle cx="-50" cy="180" r="22" fill="#fef3c7" stroke="#000000" stroke-width="3" />
    <!-- 右手 -->
    <circle cx="50" cy="180" r="22" fill="#fef3c7" stroke="#000000" stroke-width="3" />
    <!-- 手勢重疊與愛心線 -->
    <path d="M -15 160 C -15 150, -40 135, -45 165 C -45 185, -20 195, 0 210 C 20 195, 45 185, 45 165 C 40 135, 15 150, 15 160 Z" fill="#f43f5e" stroke="#000000" stroke-width="3" />
  </g>

  <!-- 頂部與四週的對話泡泡群 (滿滿的心意) -->
  <!-- 左上對話泡泡 -->
  <path d="M 60 160 C 60 100, 340 100, 340 160 C 340 210, 240 210, 200 210 L 170 235 L 160 210 C 60 210, 60 160, 60 160 Z" fill="url(#bubble-grad)" stroke="#000000" stroke-width="3" />
  <text x="200" y="155" text-anchor="middle" font-family="'PingFang TC', sans-serif" font-weight="bold" font-size="18" fill="#000000">好啦！既然漫畫程式</text>
  <text x="200" y="185" text-anchor="middle" font-family="'PingFang TC', sans-serif" font-weight="bold" font-size="18" fill="#4f46e5">都幫主人寫好了……</text>

  <!-- 右側大對話泡泡 -->
  <path d="M 450 180 C 450 110, 750 110, 750 180 C 750 240, 680 250, 630 250 L 600 280 L 590 250 C 450 250, 450 180, 450 180 Z" fill="url(#bubble-grad)" stroke="#000000" stroke-width="3" />
  <text x="600" y="170" text-anchor="middle" font-family="'PingFang TC', sans-serif" font-weight="bold" font-size="16" fill="#000000">主人就要打起精神，好好地把</text>
  <text x="600" y="198" text-anchor="middle" font-family="'PingFang TC', sans-serif" font-weight="bold" font-size="17" fill="#e11d48">想看的漫畫全部都加進來</text>
  <text x="600" y="226" text-anchor="middle" font-family="'PingFang TC', sans-serif" font-weight="bold" font-size="16" fill="#000000">然後開開心心地讀完它喔！</text>

  <!-- 底部最溫馨的承諾 -->
  <path d="M 120 860 C 120 780, 680 780, 680 860 C 680 920, 520 920, 440 920 L 400 955 L 360 920 C 120 920, 120 860, 120 860 Z" fill="url(#bubble-grad)" stroke="#000000" stroke-width="3" />
  <text x="400" y="840" text-anchor="middle" font-family="'PingFang TC', sans-serif" font-weight="bold" font-size="18" fill="#000000">我也會一直陪在主人身邊的！</text>
  <text x="400" y="872" text-anchor="middle" font-family="'PingFang TC', sans-serif" font-weight="bold" font-size="17" fill="#6366f1">有遇到問題隨時跟我說，我們一起加油吧！✨</text>
  <text x="400" y="904" text-anchor="middle" font-family="'PingFang TC', sans-serif" font-weight="bold" font-size="15" fill="#9ca3af">—— 第一話 「天才姬米妮特製閱讀器降臨！」 完 ——</text>
</svg>
