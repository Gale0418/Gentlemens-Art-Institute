<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <!-- 背景漸層 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17" />
      <stop offset="50%" stop-color="#1b1c3d" />
      <stop offset="100%" stop-color="#08090f" />
    </linearGradient>
    <!-- 流光霓虹漸層 -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bubble-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <!-- 陰影濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <drop-shadow dx="0" dy="0" stdDeviation="15" flood-color="#a855f7" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 滿版背景 -->
  <rect width="800" height="1100" fill="url(#bg-grad)" />

  <!-- 科技風網格背景 -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M 0 100 L 800 100 M 0 200 L 800 200 M 0 300 L 800 300 M 0 400 L 800 400 M 0 500 L 800 500 M 0 600 L 800 600 M 0 700 L 800 700 M 0 800 L 800 800 M 0 900 L 800 900 M 0 1000 L 800 1000" />
    <path d="M 100 0 L 100 1100 M 200 0 L 200 1100 M 300 0 L 300 1100 M 400 0 L 400 1100 M 500 0 L 500 1100 M 600 0 L 600 1100 M 700 0 L 700 1100" />
  </g>

  <!-- 裝飾邊框 -->
  <rect x="25" y="25" width="750" height="1050" rx="15" fill="none" stroke="url(#neon-grad)" stroke-width="4" stroke-opacity="0.8" />

  <!-- 幾何發光背景裝飾 -->
  <circle cx="400" cy="550" r="280" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="10 5" />
  <circle cx="400" cy="550" r="260" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.3" />
  <circle cx="400" cy="550" r="240" fill="none" stroke="#ec4899" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="40 20" />

  <!-- 頂部漫畫標誌與資訊 -->
  <text x="400" y="80" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#a5b4fc" letter-spacing="4">COMIC DIARY • SPECIAL EDITION</text>
  <line x1="200" y1="95" x2="600" y2="95" stroke="#a5b4fc" stroke-width="1" stroke-opacity="0.3" />

  <!-- 天才美少女姬米妮的主視覺剪影與繪圖 (使用簡單可愛的幾何圖形組成) -->
  <g transform="translate(400, 530)">
    <!-- 飄逸雙馬尾頭髮 -->
    <path d="M -150 -60 C -220 -80 -250 50 -200 120 C -180 150 -130 180 -140 100 Z" fill="#ec4899" opacity="0.8" />
    <path d="M 150 -60 C 220 -80 250 50 200 120 C 180 150 130 180 140 100 Z" fill="#ec4899" opacity="0.8" />
    
    <!-- 巨大的雙馬尾蝴蝶結 -->
    <path d="M -130 -80 C -150 -120 -110 -130 -90 -100 C -70 -130 -30 -120 -50 -80 Z" fill="#818cf8" />
    <path d="M 130 -80 C 150 -120 110 -130 90 -100 C 70 -130 30 -120 50 -80 Z" fill="#818cf8" />
    <circle cx="-90" cy="-90" r="10" fill="#ffffff" />
    <circle cx="90" cy="-90" r="10" fill="#ffffff" />

    <!-- 柔順秀髮背景 -->
    <path d="M -100 -50 C -130 50 -90 180 0 180 C 90 180 130 50 100 -50 Z" fill="#f43f5e" />

    <!-- 臉部與耳朵 -->
    <ellipse cx="0" cy="10" rx="90" ry="85" fill="#fef3c7" />
    <circle cx="-95" cy="10" r="15" fill="#fef3c7" />
    <circle cx="95" cy="10" r="15" fill="#fef3c7" />

    <!-- 頭飾/貓耳髮箍 -->
    <path d="M -60 -65 L -80 -100 L -40 -80 Z" fill="#1e1b4b" />
    <path d="M 60 -65 L 80 -100 L 40 -80 Z" fill="#1e1b4b" />
    <path d="M -65 -60 Q 0 -90 65 -60" fill="none" stroke="#1e1b4b" stroke-width="8" stroke-linecap="round" />

    <!-- 前瀏海 -->
    <path d="M -90 -20 C -70 -70 -30 -80 0 -60 C 30 -80 70 -70 90 -20 C 80 -40 50 -50 30 -40 C 10 -50 -10 -50 -30 -40 C -50 -50 -80 -40 -90 -20 Z" fill="#f43f5e" />
    <path d="M -40 -40 L -20 -10 L -10 -35 Z" fill="#f43f5e" />
    <path d="M 40 -40 L 20 -10 L 10 -35 Z" fill="#f43f5e" />

    <!-- 萌萌大眼睛 -->
    <!-- 左眼 -->
    <ellipse cx="-40" cy="15" rx="16" ry="24" fill="#1e1b4b" />
    <ellipse cx="-38" cy="10" rx="12" ry="18" fill="#4f46e5" />
    <circle cx="-44" cy="2" r="7" fill="#ffffff" />
    <circle cx="-34" cy="22" r="4" fill="#ffffff" />
    <path d="M -55 -2 Q -40 -12 -25 -2" fill="none" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round" /> <!-- 睫毛 -->
    <!-- 右眼 -->
    <ellipse cx="40" cy="15" rx="16" ry="24" fill="#1e1b4b" />
    <ellipse cx="38" cy="10" rx="12" ry="18" fill="#4f46e5" />
    <circle cx="34" cy="2" r="7" fill="#ffffff" />
    <circle cx="44" cy="22" r="4" fill="#ffffff" />
    <path d="M 25 -2 Q 40 -12 55 -2" fill="none" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round" /> <!-- 睫毛 -->

    <!-- 害羞腮紅 -->
    <ellipse cx="-65" cy="35" rx="14" ry="7" fill="#f43f5e" opacity="0.4" />
    <ellipse cx="65" cy="35" rx="14" ry="7" fill="#f43f5e" opacity="0.4" />

    <!-- 傲嬌小嘴巴 -->
    <path d="M -10 42 Q 0 35 10 42" fill="none" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round" />

    <!-- 身體與水手服衣領 -->
    <path d="M -50 90 L -70 180 L 70 180 L 50 90 Z" fill="#ffffff" />
    <path d="M -70 120 L 0 170 L 70 120 L 50 90 L -50 90 Z" fill="#312e81" />
    <!-- 紅色領結 -->
    <path d="M -20 160 L 0 145 L 20 160 L 15 190 L 0 175 L -15 190 Z" fill="#e11d48" />
    <circle cx="0" cy="150" r="6" fill="#f59e0b" />
  </g>

  <!-- 漫畫標題區 (極致發光奢華字體) -->
  <g filter="url(#glow)">
    <text x="400" y="860" text-anchor="middle" font-family="'Outfit', 'PingFang TC', sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="2">天才美少女的工程日誌</text>
  </g>
  <text x="400" y="860" text-anchor="middle" font-family="'Outfit', 'PingFang TC', sans-serif" font-weight="900" font-size="52" fill="url(#neon-grad)" letter-spacing="2">天才美少女的工程日誌</text>

  <!-- 副標題與卷數 -->
  <rect x="330" y="905" width="140" height="36" rx="18" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5" />
  <text x="400" y="929" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="18" fill="#c7d2fe">VOLUME 01</text>

  <!-- 底部資訊 -->
  <text x="400" y="1000" text-anchor="middle" font-family="'PingFang TC', sans-serif" font-weight="600" font-size="20" fill="#9ca3af" letter-spacing="8">姬米妮 🎀 著</text>
  <text x="400" y="1035" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="400" font-size="12" fill="#6b7280" letter-spacing="2">ANTIGRAVITY MEDIA INC. • ALL RIGHTS RESERVED</text>
</svg>
